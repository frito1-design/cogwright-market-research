# Brand dealer locators — Stage 1 primary source (CW-RES-001 §3).
#
# STATE OF THIS FILE
#
# Every URL below has been checked against a web search index: the URL exists and is the
# brand's dealer/store locator. That is `url_confirmed: true`. Of the 30 entries, 2 of the
# original guesses were right and 27 were wrong and have been corrected — so this pass was
# worth doing, and the pre-correction file would have produced a near-empty universe.
#
# `verified` is still false everywhere, and it means something stricter: nobody has opened
# the page and confirmed it lists retailers *with website links*, or determined whether the
# list is in the HTML or arrives over XHR. That check needs a browser and could not be done
# from the environment that wrote this (no outbound network — see docs/RUN_STATUS.md).
#
# So: the addresses are now right, the payload shapes are still unknown.
#
# REMAINING WORK, per brand:
#   1. Open the URL. Confirm it lists retailers and that entries carry website links — a
#      locator giving only name/address/phone is useless here, since Stage 2 needs a
#      domain. Set `verified: true` when it does.
#   2. If the dealer list arrives over XHR (watch the network tab), switch `kind` to `json`,
#      point `url` at the endpoint, and set `array_path` / `website_key` from the payload.
#   3. If a locator only returns results near a searched location rather than a full list,
#      note it — those need repeated queries across metros, which `harvest_locator` does
#      not do today.
#
# Three third-party locator widgets recur, and all three mean `kind: json` work:
#   - Locally (locally.com)  — Sage, Smith
#   - Storemapper            — Umpqua
#   - Google Maps embeds     — Scott, Winston
# Identifying the widget usually finds the endpoint faster than reading the page.
#
# `harvest_locator` fetches these through the same polite client as everything else, so a
# wrong URL costs one 404 and a log line. Unverified entries are still harvested.
#
# Recording which locators a domain appeared on is itself a scoring input: a shop on the
# Simms *and* Fishpond *and* Sage locators has a vendor mix Cogwright already has mappings
# for, and 8+ appearances earns the §8 modifier.

