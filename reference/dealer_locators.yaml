# Brand dealer locators — Stage 1 primary source (CW-RES-001 §3).
#
# READ THIS BEFORE THE FIRST RUN.
#
# Every `url` below is UNVERIFIED (`verified: false`). They were written from the brand
# list in §3 without network access to confirm them, so treat each as a starting guess,
# not a fact. Dealer locators move, and a good share of them are JavaScript front-ends
# over a JSON endpoint that this file cannot know the shape of until someone opens the
# page with devtools.
#
# Working procedure for each brand:
#   1. Open the locator in a browser and confirm it lists retailers with websites.
#   2. If the dealer list arrives over XHR, switch `kind` to `json`, set `array_path`
#      and `website_key` from the payload, and point `url` at the endpoint.
#   3. Set `verified: true`.
#
# `harvest_locator` fetches these through the same polite client as everything else, so
# a wrong URL costs one 404 and a log line, not a rate-limit ban. Unverified entries are
# still harvested — a wrong guess is cheap and a right one is free.
#
# The point of recording which locators a domain appeared on is that the list is itself a
# scoring input: a shop on the Simms *and* Fishpond *and* Sage locators has a vendor mix
# Cogwright already has mappings for, and 8+ appearances earns the §8 modifier.

locators:
