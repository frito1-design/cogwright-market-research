  # Hareline is in the §3 brand list but has no public dealer locator that could be found.
  # Their published position is that they do not sell to the public and to "support your
  # local Hareline dealer", with no locator tool behind it. Left disabled rather than
  # pointed at a guessed URL. If one turns up, add it — Hareline overlap is a strong
  # signal, since a shop carrying Hareline is a shop with a real fly-tying wall.
  - name: hareline
    url: https://www.hareline.com/
    kind: html
    url_confirmed: false
    verified: false
    enabled: false
    notes: >-
      NO PUBLIC LOCATOR FOUND. Homepage only, harvesting disabled. Do not enable without
      finding a real dealer list; harvesting a brand homepage yields noise, not dealers.

# AFFTA (§3): only a publicly published member directory may be used, and only what an
# anonymous browser can see. Nothing obtained through the advisory relationship goes in
# this file or anywhere else in this repo. No entry is listed because none was confirmed
